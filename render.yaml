services:

  # ── FRONTEND — static site ─────────────────────────────────────────────
  - type: web
    name: secureye-frontend
    runtime: static
    buildCommand: ""

  # ── BACKEND — FastAPI (stateless) ─────────────────────────────────────
  - type: web
    name: secureye-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECUREYE_SIGNING_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://secureye.onrender.com
