services:

  # ── FRONTEND — static site ─────────────────────────────────────────────
  - type: web
    name: secureye-frontend
    runtime: static
    staticPublishPath: ./frontend
    buildCommand: ""
    routes:
      - type: rewrite
        source: /docs
        destination: /docs.html
      - type: rewrite
        source: /verify
        destination: /verify.html
      - type: rewrite
        source: /demo
        destination: /verify.html
      - type: rewrite
        source: /*
        destination: /index.html

  # ── BACKEND — FastAPI (stateless) ─────────────────────────────────────
  - type: web
    name: secureye-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    pythonVersion: "3.11.9"
    envVars:
      - key: SECUREYE_SIGNING_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://secureye.onrender.com
